<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlightMotion Premium | Akses VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-card: #121212;
            --border: #222222;
            --border-focus: #ffffff;
            --text-main: #ffffff;
            --text-dim: #777777;
            --accent: #ffffff;
            --accent-invert: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Header Style */
        .header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
        }
        .header h1 { 
            font-size: 13px; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        .token-badge {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .view-section { display: none; padding: 24px; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        p.subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; font-weight: 400; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            width: 100%; 
            background: var(--surface-card); 
            border: 1px solid var(--border);
            color: var(--text-main); 
            padding: 16px; 
            border-radius: 14px;
            font-size: 14px; 
            outline: none; 
            transition: all 0.2s ease;
            font-weight: 500;
        }
        input:focus { 
            border-color: var(--border-focus); 
            background: #161616;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
        }

        .btn {
            width: 100%; 
            background: var(--accent); 
            color: var(--accent-invert);
            border: none; 
            padding: 16px; 
            border-radius: 14px;
            font-size: 13px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s ease;
            margin-top: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1.2px;
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
        }

        .btn-outline { 
            background: var(--surface-card); 
            border: 1px solid var(--border); 
            color: var(--text-main); 
        }
        .btn-outline:hover { 
            background: #181818; 
            border-color: #444;
        }

        .btn-wa { 
            background: #ffffff; 
            color: #000000; 
            border: 1px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-wa:hover { 
            background: #e6e6e6; 
        }

        .box { 
            background: var(--surface-card); 
            border: 1px solid var(--border); 
            padding: 18px; 
            border-radius: 16px; 
            margin-bottom: 16px; 
        }
        .box-title { 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            color: var(--text-dim); 
            letter-spacing: 1px;
        }
        
        pre { 
            background: #050505; 
            color: #00ffcc; 
            padding: 16px; 
            border-radius: 12px; 
            font-size: 11px; 
            overflow-x: auto; 
            border: 1px solid var(--border); 
            min-height: 70px; 
            white-space: pre-wrap; 
            font-family: monospace;
        }

        /* Toast Modern */
        .toast {
            position: fixed; 
            top: 24px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-20px);
            background: #ffffff; 
            color: #000000; 
            padding: 12px 22px; 
            border-radius: 30px;
            font-size: 12px; 
            font-weight: 700; 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 1000; 
            box-shadow: 0 15px 35px rgba(255,255,255,0.15);
            letter-spacing: 0.3px;
        }
        .toast.show { 
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0); 
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Notifikasi</div>

    <div class="container">
        <!-- HEADER -->
        <div class="header hidden" id="main-header">
            <h1>AM PREMIUM</h1>
            <div class="token-badge"><span id="user-token-display">⏳ Mengecek...</span></div>
        </div>

        <!-- VIEW: AKTIVASI TOKEN -->
        <div class="view-section active" id="view-activation">
            <h2>Aktivasi Akses ⚡</h2>
            <p class="subtitle">Masukkan kode token andalanmu buat buka akses panel premium sepuasnya.</p>
            
            <div class="input-group">
                <label>Kode Token VIP</label>
                <input type="text" id="input-first-redeem" placeholder="Contoh: AM-XXXXX">
            </div>
            <button class="btn" onclick="redeemFirstToken()">Aktifkan Sekarang</button>
            <button class="btn btn-wa" style="margin-top: 12px;" onclick="beliToken()">💬 Beli Token via Admin</button>
        </div>

        <!-- VIEW: DASHBOARD UTAMA -->
        <div class="view-section" id="view-dashboard">
            <div class="box" style="border-color: #2a2a2a;">
                <div class="box-title">🔥 Perpanjang Masa Aktif</div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="input-redeem" placeholder="Masukkan token baru..." style="margin-bottom:0;">
                    <button class="btn" style="margin-top:0; width: 110px; padding: 0 10px;" onclick="redeemToken()">Redeem</button>
                </div>
                <button class="btn btn-wa" style="margin-top: 12px;" onclick="beliToken()">💬 Beli Token via Admin</button>
            </div>

            <div class="box">
                <div class="box-title">1. Request Link (Step 1)</div>
                <input type="email" id="email-input" placeholder="Ketik email aktif kamu...">
                <button class="btn btn-outline" id="btn-send" style="margin-top: 10px;">Kirim Permintaan</button>
            </div>

            <div class="box">
                <div class="box-title">2. Eksekusi Premium (Step 2)</div>
                <input type="text" id="verify-input" placeholder="Tempel link verifikasi di sini...">
                <button class="btn" id="btn-verify" style="margin-top: 10px;">Eksekusi Link</button>
            </div>

            <div class="box-title" style="margin-top: 18px;">Status Server API</div>
            <pre id="response-output">Sistem siap. Menunggu perintah...</pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
