<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlightMotion Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --border: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #ffffff;
            --accent-invert: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 14px; font-weight: 800; letter-spacing: 1px; }
        .token-badge {
            background: var(--border);
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        .view-section { display: none; padding: 20px; }
        .view-section.active { display: block; }

        h2 { font-size: 20px; margin-bottom: 8px; }
        p.subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text-main); padding: 14px; border-radius: 8px;
            font-size: 14px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--text-main); }

        .btn {
            width: 100%; background: var(--accent); color: var(--accent-invert);
            border: none; padding: 14px; border-radius: 8px;
            font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s;
            margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--border); }
        .btn-wa { background: #128C7E; color: white; border: none; }
        .btn-wa:hover { background: #075E54; }

        .box { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .box-title { font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: var(--text-dim); }
        
        pre { background: #000; color: #00ffcc; padding: 15px; border-radius: 8px; font-size: 11px; overflow-x: auto; border: 1px solid var(--border); min-height: 60px; white-space: pre-wrap; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-main); color: var(--bg); padding: 12px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 600; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Notifikasi</div>

    <div class="container">
        <div class="header hidden" id="main-header">
            <h1>ALIGHTMOTION PREMIUM</h1>
            <div class="token-badge"><span id="user-token-display">⏳ Mengecek...</span></div>
        </div>

        <!-- VIEW: AKTIVASI TOKEN -->
        <div class="view-section active" id="view-activation">
            <h2>Aktivasi Akses</h2>
            <p class="subtitle">Masukkan kode token yang Anda beli dari Admin untuk menggunakan panel.</p>
            
            <div class="input-group">
                <label>Kode Token Aktivasi</label>
                <input type="text" id="input-first-redeem" placeholder="Contoh: AM-XXXXX">
            </div>
            <button class="btn" onclick="redeemFirstToken()">Aktifkan Sekarang</button>
            <button class="btn btn-wa" style="margin-top: 10px;" onclick="beliToken()">🛒 Beli Kode Akses via Admin (WA)</button>
        </div>

        <!-- VIEW: DASHBOARD UTAMA -->
        <div class="view-section" id="view-dashboard">
            <div class="box" style="border-color: #333;">
                <div class="box-title">Perpanjang Masa Aktif</div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="input-redeem" placeholder="Kode Token Baru" style="margin-bottom:0;">
                    <button class="btn" style="margin-top:0; width: 100px;" onclick="redeemToken()">Tambah</button>
                </div>
                <button class="btn btn-wa" style="margin-top: 10px;" onclick="beliToken()">🛒 Beli Kode Akses via Admin (WA)</button>
            </div>

            <div class="box">
                <div class="box-title">1. Request Link (Gratis)</div>
                <input type="email" id="email-input" placeholder="Masukkan alamat email anda...">
                <button class="btn btn-outline" id="btn-send">Kirim Permintaan</button>
            </div>

            <div class="box">
                <div class="box-title">2. Eksekusi Premium</div>
                <input type="text" id="verify-input" placeholder="Tempel Link Verifikasi...">
                <button class="btn" id="btn-verify">Eksekusi Link</button>
            </div>

            <div class="box-title" style="margin-top: 15px;">Status Server API</div>
            <pre id="response-output">Sistem siap. Menunggu perintah...</pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
